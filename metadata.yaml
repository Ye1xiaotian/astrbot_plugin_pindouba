name: astrbot_plugin_pindouba
display_name: 拼豆吧
desc: 可以将喜欢的图片拼成豆，还可以拼群友玩
short_desc: 把图片或 QQ 头像变成像素拼豆画，可选接多模态模型做识别和裁剪。
help: |
  把一张图片变成像素拼豆画：彩色方格铺满整张图，背景也保留，
  每个方格的颜色取自原图。

  命令是 /拼豆，私聊群聊都一样，不受机器人唤醒前缀影响：
    /拼豆 + 图片            命令和图片放在同一条消息里
    引用图片 + 回复 /拼豆
    先发图片，10 分钟内补发 /拼豆

  拼头像（仅支持 QQ，不用发图、不调用模型，秒回）：
    /拼我                   拼你自己的头像
    /拼 + @某人             拼对方的头像

  拼豆图纸与材料清单（打开 bead_chart，默认关）：
    成图之外多发一张图纸，每个格子里标着这一格该用的 MARD 色号，
    深色格白字、浅色格黑字，跟着图纸一格一格摆就能拼出实物。
    回复文字里附材料清单：用了几种颜色、共多少颗、用量前五的色号，
    加起来不到 10 颗的零头色也会单独提醒，照着单子买豆就行。
    开着它会自动按色卡量化，只想要成图就不开。

  说明：
    - 一次发了多张图，只处理第一张
    - 同一张图再拼一次（链接变了也算）会跳过识别直接出图
    - 冷却按人算，每人每个会话 30 秒（可调整），群里其他人不受影响
    - 打开 bead_palette 后颜色只从 MARD 221 色官方色卡里选，手工感更强，但会偏离原图；再开 bead_dither 可让渐变过渡更顺滑（相邻格子匀色）
    - 打开 auto_crop 且配置了模型时，自动裁掉背景只拼主体
    - 超长截图这类长宽比悬殊的图拼出来认不出，插件会提示先裁剪

  可选配置一个支持图片输入的模型，用来识别内容和裁剪主体。
  把 enable_caption 和 auto_crop 都关掉就完全不调用模型，出图最快。
  模型不可用时按原图直接渲染。
version: 0.6.2
author: Ye1xiaotian
repo: https://github.com/Ye1xiaotian/astrbot_plugin_pindouba
astrbot_version: ">=4.0,<5"
