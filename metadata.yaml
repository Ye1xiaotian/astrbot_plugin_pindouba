name: astrbot_plugin_pindouba
display_name: 拼豆吧
desc: 我是一座小手工坊：你发来图片，我把它的每一格都钉上一颗彩豆，连背景一起，拼出一整幅拼豆画。多模态模型在时我更懂裁剪和取名；它不在，我一个人也照拼不误。
help: |
  嗨，我是拼豆吧。丢一张图片给我，我会把它变成一幅彩色的拼豆画——
  豆子铺满整张图，背景也不落下。

  唤醒我的暗号是 /拼豆（不受机器人唤醒前缀影响）：
    /拼豆 + 图片            命令和图片塞在同一条消息里
    引用某张图片 + 回复 /拼豆
    先发图片 → 10 分钟内发 /拼豆

  我的性格：
    - 每颗豆的颜色都老老实实取自原图，不添油加醋
    - 自带 56 色经典拼豆色板，想要更"手工"的扁平质感可以打开
    - 模型朋友在时，我会自动裁掉背景、还会告诉你我拼的是什么
    - 模型朋友不在？没关系，我一个人也照拼不误
    - 同一张图再来一次，我秒回（冷却 30 秒防上头）

  需要的装备：
    - 可选：一个支持图片输入的对话模型（qwen-vl / gemini / gpt-4o / glm-4v）
version: v0.4.1
