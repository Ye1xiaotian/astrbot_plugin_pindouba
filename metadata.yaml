name: astrbot_plugin_pindouba
display_name: 拼豆吧
desc: 将一张图片变成像素拼豆画，可接入支持多模态的模型来只绘画人物部分并附上识别说明；不配置模型也能出图。
help: |
  把一张图片变成像素拼豆画：彩色方格铺满整张图，背景也保留，
  每个方格的颜色取自原图。

  命令是 /拼豆，私聊群聊都一样，不受机器人唤醒前缀影响：
    /拼豆 + 图片            命令和图片放在同一条消息里
    引用图片 + 回复 /拼豆
    先发图片，10 分钟内补发 /拼豆

  说明：
    - 一次发了多张图，只处理第一张
    - 同一张图再次触发会跳过识别直接出图
    - 两次触发之间有 30 秒冷却（可在配置里调整）
    - 打开 bead_palette 后颜色只从 56 色经典拼豆色卡里选，手工感更强，但会偏离原图
    - 打开 auto_crop 且配置了模型时，自动裁掉背景只拼主体

  可选配置一个支持图片输入的模型，
  用于识别图片内容；模型不可用时按原图直接渲染。
version: 0.4.3
author: Ye1xiaotian
repo: https://github.com/Ye1xiaotian/astrbot_plugin_pindouba
